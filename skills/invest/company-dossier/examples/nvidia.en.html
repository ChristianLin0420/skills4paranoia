<style>
/* tokens — html-design-system/reference/tokens.md */
:root{
 --bg:#F1F2F3;--surface:#FAFBFB;--sunk:#F6F7F8;
 --ink:#14171A;--ink2:#5F656B;--ink3:#8A9096;
 --rule:#DCE0E3;--rule-soft:#E8EBED;
 --accent:#3A6183;--accent-deep:#27435C;--accent-soft:#DBE4EB;--accent-wash:#EAF0F4;
 --warn:#8C4A3C;--warn-soft:#EFE3E0;--name:#54547A;--name-soft:#E6E6EE;
 --s2:#7A8B99;--s3:#A8907C;   /* additional series, desaturated on purpose */
 --sans:'IBM Plex Sans','Noto Sans TC',sans-serif;
 --mono:'IBM Plex Mono','Noto Sans TC',Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.62 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,27vw,392px);min-height:100vh}
main{padding:30px 34px 80px;min-width:0}
aside{border-left:1px solid var(--rule);background:var(--surface);position:sticky;top:0;
      height:100vh;overflow-y:auto;padding:30px 22px 40px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1{font-size:22px;font-weight:500;letter-spacing:-.01em;margin:0 0 3px}
h2{font-size:15px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-deep);
   margin:30px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.sub{font-size:12.5px;color:var(--ink2);margin:0 0 16px;font-family:var(--mono)}
.banner{border:1px solid var(--warn);background:var(--warn-soft);padding:11px 15px;margin:0 0 18px;
        font-size:13.5px;display:flex;gap:11px;align-items:flex-start;line-height:1.55}
.banner .t{font-family:var(--mono);font-size:11px;font-weight:500;color:#fff;background:var(--warn);
           padding:2px 7px;white-space:nowrap;margin-top:2px;letter-spacing:.04em}
.banner.ok{border-color:var(--accent);background:var(--accent-wash)}
.banner.ok .t{background:var(--accent)}

/* the three sentences — the first thing, deliberately large */
.three{border-left:2px solid var(--accent);padding:2px 0 2px 18px;margin:0 0 8px}
.three li{font-size:16.5px;line-height:1.55;margin:0 0 11px;list-style:none}
.three li:last-child{margin-bottom:0}
.three .q{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
          color:var(--ink3);margin-bottom:3px}
.three .unanswered{color:var(--warn)}

.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:22px}
.chart{border:1px solid var(--rule);background:var(--surface);border-radius:3px;padding:12px 14px 8px}
.chart h3{font-size:13.5px;font-weight:500;margin:0 0 2px}
.chart .cap{font-size:11px;color:var(--ink3);margin:0 0 8px;line-height:1.45}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax{stroke:var(--rule);stroke-width:1}
.gl{stroke:var(--rule-soft);stroke-width:1}
.tk{font-family:var(--mono);font-size:9.5px;fill:var(--ink3)}
.ln{fill:none;stroke-width:1.75}
.pt{stroke:#fff;stroke-width:1;cursor:pointer}
.pt:hover{r:5}
.xh{stroke:var(--accent);stroke-width:1;opacity:.5}
.xhb{fill:var(--accent);opacity:.08}
.yr{font-family:var(--mono);font-size:11px;color:var(--accent-deep);background:var(--accent-soft);
    padding:1px 7px;border-radius:2px}
.rs{fill:none;stroke:var(--warn);stroke-width:1.4;stroke-dasharray:3 2}
.brk{stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 3}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:11px}
.leg span{display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--ink2)}
.leg span.off{opacity:.35}
.leg i{width:14px;height:2.5px;border-radius:2px;display:block}

table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--ink3);
   padding:0 10px 6px 0;border-bottom:1px solid var(--rule)}
td{padding:6px 10px 6px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding-right:14px}
.tag{font-family:var(--mono);font-size:10px;padding:1.5px 6px;border-radius:2px;background:var(--rule-soft);color:var(--ink2)}
.tag.on{background:var(--accent-soft);color:var(--accent-deep)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.conf{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:2px}
.conf.verified{background:var(--accent-soft);color:var(--accent-deep)}
.conf.stated{background:var(--rule-soft);color:var(--ink2)}
.conf.inferred{background:var(--warn-soft);color:var(--warn)}
.trap{border-left:2px solid var(--warn);background:var(--warn-soft);padding:10px 12px;margin-top:14px;
      font-size:13px;line-height:1.6;color:#5E3228}
.trap .h{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--warn);margin-bottom:4px}
details{font-size:13px;color:var(--ink2);margin-top:12px}
summary{cursor:pointer;font-size:11.5px;color:var(--ink3);font-family:var(--mono)}
b.name{font-weight:600;color:var(--name)}
dl{margin:0;display:grid;grid-template-columns:82px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
dt{color:var(--ink3);font-size:11.5px;padding-top:3px}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
dd.mono{font-family:var(--mono);font-size:12px;line-height:1.5}
.empty{font-size:13.5px;color:var(--ink3);line-height:1.65}
.blk{margin-top:14px;padding-top:11px;border-top:1px solid var(--rule-soft);font-size:13px;color:var(--ink2);line-height:1.62}
.blk .h{font-size:10.5px;letter-spacing:.09em;color:var(--ink3);margin-bottom:5px;font-family:var(--mono)}
footer{grid-column:1/-1;padding:14px 34px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink3);
       display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
</style>

const $ = s => document.querySelector(s);
const C = DOSSIER.company;
$("#ttl").textContent = C.name + " (" + C.ticker + ")";
$("#meta").innerHTML = ["CIK " + C.cik, C.sic, "FY ends " + C.fyEnd,
                        "first filing " + C.firstFiling, "as of " + DOSSIER.asOf].join(" · ");

$("#banner").innerHTML =
  '<div class="banner' + (DOSSIER.verified ? " ok" : "") + '"><span class="t">' +
  (DOSSIER.verified ? "SOURCED" : "COVERAGE") + '</span><p style="margin:0">' +
  DOSSIER.coverage + (DOSSIER.note ? " " + DOSSIER.note : "") + '</p></div>';

/* ── the three sentences ─────────────────────────────────────────────────── */
$("#three").innerHTML = DOSSIER.sentences.map(s =>
  '<li><span class="q">' + s.q + '</span>' + s.a +
  (s.flag ? '<div class="trap" style="margin-top:9px"><div class="h">NOT FULLY SUPPORTED</div>' +
            s.flag + '</div>' : '') + '</li>').join("");

/* ── one chart engine, so every chart reads the same ─────────────────────── */
// Ticks must bracket the data: a top tick below the maximum draws the series
// outside the plot box, which looks like a chart rather than like a bug.
function ticks(lo, hi, n) {
  if (hi <= lo) hi = lo + 1;
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  let step = 10 * mag;
  for (const m of [1, 2, 2.5, 5, 10]) { if (raw <= m * mag) { step = m * mag; break; } }
  const out = [Math.floor(lo / step) * step];
  while (out[out.length - 1] < hi - 1e-9) out.push(+(out[out.length - 1] + step).toFixed(10));
  return out;
}
const fmt = (v, u) => u === "%" ? v.toFixed(1) : (Math.abs(v) >= 1000 ? (v / 1000).toFixed(1) + "k" : String(+v.toFixed(1)));
const off = {};

function logTicks(lo, hi) {
  const out = [];
  for (let e = Math.floor(Math.log10(Math.max(lo, 1e-9))); e <= Math.ceil(Math.log10(hi)); e++)
    out.push(Math.pow(10, e));
  return out;
}
function draw(c) {
  const W = 470, H = 210, L = 46, R = 10, T = 8, B = 26;
  const live = c.series.filter(s => !off[c.id + s.name]);
  const xs = c.series[0].pts.map(p => p[0]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const vals = live.flatMap(s => s.pts.map(p => p[1]));
  // Zero-base anything whose magnitude is the point — revenue, income, cash. Do NOT
  // zero-base a count that never goes near zero: a share-count series drawn from 0
  // compresses the dilution into a tenth of the plot, and dilution is the only reason
  // that chart exists. The chart declares which it is.
  // A 20-year price that moves 400x is a flat line for 15 of them on a linear axis.
  // Log is the honest choice there and dishonest almost everywhere else, so it is
  // declared per chart and the caption says so.
  const lg = c.log === true;
  const zero = c.zero !== false && !lg;
  const lo = lg ? Math.min(...vals)
           : zero ? Math.min(0, ...vals)
           : Math.min(...vals) - (Math.max(...vals) - Math.min(...vals)) * 0.15;
  const hi = Math.max(...vals, zero ? 0 : -Infinity);
  const tk = lg ? logTicks(lo, hi) : ticks(lo, hi, 4);
  const yLo = tk[0], yHi = tk[tk.length - 1];
  const lv = v => Math.log10(Math.max(v, 1e-9));
  const X = v => L + (v - x0) / Math.max(1, x1 - x0) * (W - L - R);
  const Y = v => lg ? H - B - (lv(v) - lv(yLo)) / (lv(yHi) - lv(yLo)) * (H - T - B)
                    : H - B - (v - yLo) / (yHi - yLo) * (H - T - B);

  let g = "";
  for (const t of tk)
    g += '<line class="gl" x1="' + L + '" y1="' + Y(t) + '" x2="' + (W - R) + '" y2="' + Y(t) + '"/>' +
         '<text class="tk" x="' + (L - 6) + '" y="' + (Y(t) + 3) + '" text-anchor="end">' + fmt(t, c.unit) + '</text>';
  for (const v of xs) if ((v - x0) % 3 === 0 || v === x1)
    g += '<text class="tk" x="' + X(v) + '" y="' + (H - 8) + '" text-anchor="middle">' + String(v).slice(2) + '</text>';
  g += '<line class="ax" x1="' + L + '" y1="' + Y(Math.max(yLo, 0)) + '" x2="' + (W - R) + '" y2="' + Y(Math.max(yLo, 0)) + '"/>';

  for (const m of (c.marks || []))
    g += '<line class="brk" x1="' + X(m.x) + '" y1="' + T + '" x2="' + X(m.x) + '" y2="' + (H - B) + '"/>';

  if (hoverYear !== null && hoverYear >= x0 && hoverYear <= x1)
    g += '<line class="xh" x1="' + X(hoverYear) + '" y1="' + T + '" x2="' + X(hoverYear) + '" y2="' + (H - B) + '"/>';

  for (const s of live) {
    g += '<path class="ln" stroke="' + s.color + '" d="' +
         s.pts.map((p, i) => (i ? "L" : "M") + X(p[0]) + " " + Y(p[1])).join(" ") + '"/>';
    for (const p of s.pts)
      g += '<circle class="pt" fill="' + s.color + '" cx="' + X(p[0]) + '" cy="' + Y(p[1]) + '" r="2.8" ' +
           'data-c="' + c.id + '" data-s="' + s.name + '" data-x="' + p[0] + '" data-v="' + p[1] + '"/>';
  }
  g += '<rect x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (H - T - B) +
       '" fill="transparent" data-hit="' + c.id + '" data-x0="' + x0 + '" data-x1="' + x1 +
       '" data-l="' + L + '" data-w="' + (W - L - R) + '"/>';
  return '<div class="chart"><h3>' + c.title + '</h3><p class="cap">' + c.cap +
         (c.marks || []).map(m => ' &middot; <b>' + m.x + ':</b> ' + m.label).join("") + '</p>' +
         '<svg viewBox="0 0 ' + W + ' ' + H + '">' + g + '</svg><div class="leg">' +
         c.series.map(s => '<span class="' + (off[c.id + s.name] ? "off" : "") + '" data-t="' + c.id + s.name +
           '"><i style="background:' + s.color + '"></i>' + s.name + '</span>').join("") + '</div></div>';
}

let hoverYear = null;
function charts() {
  $("#charts").innerHTML = DOSSIER.charts.map(draw).join("");
  document.querySelectorAll(".leg span").forEach(el =>
    el.onclick = ev => { ev.stopPropagation(); off[el.dataset.t] = !off[el.dataset.t]; charts(); });
  // Hover anywhere on any chart: every chart draws the crosshair at the same fiscal
  // year, and the panel lists that year across every series in the file. Reading one
  // year across the whole dossier is the thing you actually want, and per-point
  // tooltips cannot do it.
  document.querySelectorAll("[data-hit]").forEach(el => {
    el.onmousemove = ev => {
      const b = el.getBoundingClientRect();
      const d = el.dataset, f = (ev.clientX - b.left) / b.width;
      const y = Math.round(+d.x0 + f * (+d.x1 - +d.x0));
      if (y !== hoverYear) { hoverYear = y; charts(); year(y); }
    };
  });
  $("#charts").onmouseleave = () => { hoverYear = null; charts(); $("#panel").innerHTML = EMPTY; };
}

function year(fy) {
  const rows = [];
  for (const c of DOSSIER.charts)
    for (const s of c.series) {
      const p = s.pts.find(q => q[0] === fy);
      if (p) rows.push([s.name, fmt(p[1], c.unit) + " " + c.unit, p[2] || "", p[3] || ""]);
    }
  $("#ptitle").innerHTML = 'FY<span class="yr">' + fy + '</span>';
  $("#panel").innerHTML = !rows.length
    ? '<p class="empty">No reported figure for FY' + fy + ' in this file. A gap is shown as a gap.</p>'
    : '<table><tr><th>Series</th><th style="text-align:right">Value</th></tr>' +
      rows.map(r => '<tr><td>' + r[0] + (r[3] ? '<div style="font-size:10px;color:var(--ink3);' +
        'font-family:var(--mono);margin-top:1px">' + r[3] + '</div>' : '') +
        '</td><td class="num">' + r[1] + '</td></tr>').join("") + '</table>' +
      '<div class="blk"><div class="h">READ FROM</div>' +
      [...new Set(rows.map(r => r[2]).filter(Boolean))].map(a =>
        '<div class="mono" style="font-size:11.5px">' + a + '</div>').join("") + '</div>';
}

/* ── provenance panel ────────────────────────────────────────────────────── */
const EMPTY = '<p class="empty">Hover any point for the value, the fiscal period, and the filing it was read from.' +
  '<br><br>Every figure in this file carries an accession number. One that cannot be sourced is not drawn.</p>';

    '<dt>form</dt><dd class="mono">' + (src.form || "&mdash;") + '</dd>' +
    '<dt>accession</dt><dd class="mono">' + (src.accn || "&mdash;") + '</dd>' +
    '<dt>evidence</dt><dd><span class="conf verified">verified</span></dd></dl>' +
    '<div class="blk"><div class="h">CHART</div>' + c.title + ' &mdash; ' + c.cap + '</div>';
}

$("#rs").innerHTML = !DOSSIER.restatements.length

  : DOSSIER.restatements.map(r =>
      '<table><tr><th>' + r.concept + '</th><th>' + r.period + '</th><th>from</th></tr>' +
      r.values.map(v => '<tr><td class="num">' + v.val + '</td><td class="mono" style="font-size:11.5px">' +
        v.accn + '</td><td style="font-size:12px;color:var(--ink2)">' + v.fy + '</td></tr>').join("") +
      '</table><div class="trap"><div class="h">WHY IT MOVED</div>' + r.why + '</div>').join("");

const P = DOSSIER.people;
$("#people").innerHTML =

  P.execs.map(e => '<tr><td><b class="name">' + e.name + '</b></td><td>' + e.role +
    '</td><td class="mono">' + e.since + '</td><td style="color:var(--ink2)">' + e.note + '</td></tr>').join("") +
  '</table>' +
  '<div class="blk"><div class="h">ANNUAL PLAN PAYS ON</div>' + P.annual + '</div>' +
  '<div class="blk"><div class="h">LONG-TERM PLAN PAYS ON</div>' + P.longTerm + '</div>' +

$("#filings").innerHTML = '<table><tr><th>Accession</th><th>Form</th><th>Period</th><th>Filed</th></tr>' +
  DOSSIER.filings.map(f => '<tr><td class="mono" style="font-size:11.5px">' + f.accn + '</td><td>' +
    f.form + '</td><td class="mono">' + f.period + '</td><td class="mono">' + f.filed + '</td></tr>').join("") +
  '</table><details><summary>what is not in this file</summary>' +
  'Pre-XBRL fiscal years, anything before the first filing, and any figure that could not be traced to an ' +
  'accession number. A gap is shown as a gap.</details>';

$("#panel").innerHTML = EMPTY;
