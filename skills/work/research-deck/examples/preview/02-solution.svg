<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="02-solution"><rect width="960" height="540" fill="#F1F2F3"/><rect x="56" y="34" width="40.27" height="16" rx="2.5" fill="#DBE4EB"/><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#27435C" text-anchor="middle"><tspan x="76.135" y="45.5625">2 / 3</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#5F656B" text-anchor="start" letter-spacing="0.5"><tspan x="105.27" y="45.5625">Solution · how we solve it</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#8A9096" text-anchor="end"><tspan x="904" y="45.5625">Meridian-1 · Q3</tspan></text><rect x="56" y="62" width="848" height="0.75" rx="0" fill="#DCE0E3"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#14171A" text-anchor="start" letter-spacing="-0.2"><tspan x="56" y="108.16">Split learning physics from learning tasks with a shared world model, and let the task</tspan><tspan x="56" y="134.62">head learn only the residual</tspan></text><rect x="56" y="157.92" width="356.16" height="272.08" rx="2.5" fill="#EAF0F4"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#8A9096" text-anchor="middle"><tspan x="234.08" y="291.11">arch.png</tspan><tspan x="234.08" y="305.36">(file not found)</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#8A9096" text-anchor="start"><tspan x="56" y="443.975">Meridian-1: frozen vision encoder, shared world model, lightweight action</tspan><tspan x="56" y="456.8">decoder</tspan></text><rect x="440.16" y="157.92" width="463.84" height="0.75" rx="0" fill="#DCE0E3"/><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#27435C" text-anchor="start"><tspan x="440.16" y="177.895">Q1</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14171A" text-anchor="start"><tspan x="472.16" y="181.295">The world model is shared across tasks and the decoder learns only a</tspan><tspan x="472.16" y="199.42">residual; the vision encoder stays frozen with adapters</tspan></text><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#27435C" text-anchor="start"><tspan x="472.16" y="218.72">trainable params 11%, demos to target 4200 → 510</tspan></text><rect x="440.16" y="253.947" width="463.84" height="0.75" rx="0" fill="#E8EBED"/><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#27435C" text-anchor="start"><tspan x="440.16" y="273.922">Q2</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14171A" text-anchor="start"><tspan x="472.16" y="277.322">Simulated rollouts mixed 4:1 with material and lighting randomisation;</tspan><tspan x="472.16" y="295.447">context window spans the full episode</tspan></text><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#27435C" text-anchor="start"><tspan x="472.16" y="314.747">68% mean over 12 held-out task families</tspan></text><rect x="440.16" y="349.973" width="463.84" height="0.75" rx="0" fill="#E8EBED"/><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#27435C" text-anchor="start"><tspan x="440.16" y="369.948">Q3</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14171A" text-anchor="start"><tspan x="472.16" y="373.348">The frozen encoder quantises cleanly and the world model runs a single</tspan><tspan x="472.16" y="391.473">forward pass at inference</tspan></text><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#27435C" text-anchor="start"><tspan x="472.16" y="410.773">11ms/step, 28Hz closed loop</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#8A9096" text-anchor="start"><tspan x="56" y="462.45">The three mechanisms are independent and can be ablated one at a time — see the Δ column on page 09.</tspan></text><rect x="56" y="476" width="848" height="0.75" rx="0" fill="#DCE0E3"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#8A9096" text-anchor="start"><tspan x="56" y="492.975">Example deck · all figures are fictional</tspan></text><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#8A9096" text-anchor="end"><tspan x="904" y="492.975">02</tspan></text></svg>