,'Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#5F656B" text-anchor="start"><tspan x="56" y="371.59">Cloth fold</tspan></text><rect x="153.78" y="347.12" width="135.34" height="40.69" rx="2" fill="#EDF1F4"/><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#14171A" text-anchor="middle"><tspan x="221.45" y="371.59">12%</tspan></text><rect x="291.62" y="347.12" width="135.34" height="40.69" rx="2" fill="#EDF1F4"/><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#14171A" text-anchor="middle"><tspan x="359.29" y="371.59">24%</tspan></text><rect x="429.46" y="347.12" width="135.34" height="40.69" rx="2" fill="#A8C0D2"/><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#14171A" text-anchor="middle"><tspan x="497.13" y="371.59">43%</tspan></text><rect x="429.46" y="385.81" width="135.34" height="2" rx="0" fill="#27435C"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#5F656B" text-anchor="start"><tspan x="56" y="414.78">Long-horizon tidy</tspan></text><rect x="153.78" y="390.31" width="135.34" height="40.69" rx="2" fill="#EDF1F4"/><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#14171A" text-anchor="middle"><tspan x="221.45" y="414.78">8%</tspan></text><rect x="291.62" y="390.31" width="135.34" height="40.69" rx="2" fill="#EDF1F4"/><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#14171A" text-anchor="middle"><tspan x="359.29" y="414.78">19%</tspan></text><rect x="429.46" y="390.31" width="135.34" height="40.69" rx="2" fill="#CFDCE6"/><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#14171A" text-anchor="middle"><tspan x="497.13" y="414.78">34%</tspan></text><rect x="429.46" y="429" width="135.34" height="2" rx="0" fill="#27435C"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#8A9096" text-anchor="start"><tspan x="56" y="444.975">held-out tasks · 100 rollouts each · seed-averaged</tspan></text><rect x="594.8" y="159.36" width="14" height="2" rx="0" fill="#3A6183"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#14171A" text-anchor="start"><tspan x="594.8" y="180.46">The first four families all clear 60%</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#5F656B" text-anchor="start"><tspan x="594.8" y="199.16">These are the shorter, less contact-heavy tasks</tspan></text><rect x="594.8" y="212.01" width="309.2" height="0.75" rx="0" fill="#E8EBED"/><rect x="594.8" y="228.01" width="14" height="2" rx="0" fill="#20242A"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#14171A" text-anchor="start"><tspan x="594.8" y="249.11">Insertion is the one physically explainable gap</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#5F656B" text-anchor="start"><tspan x="594.8" y="267.81">61%, missing force feedback rather than vision</tspan></text><rect x="594.8" y="280.66" width="309.2" height="0.75" rx="0" fill="#E8EBED"/><rect x="594.8" y="296.66" width="14" height="2" rx="0" fill="#6E8FA8"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#14171A" text-anchor="start"><tspan x="594.8" y="317.76">Long-horizon sits at 34% for every method</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#5F656B" text-anchor="start"><tspan x="594.8" y="336.46">Not a method gap — the problem itself is unsolved</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#8A9096" text-anchor="start"><tspan x="56" y="462.45">One checkpoint, no per-task finetuning. Long-horizon tidy is the only category still under 50%.</tspan></text><rect x="56" y="476" width="848" height="0.75" rx="0" fill="#DCE0E3"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#8A9096" text-anchor="start"><tspan x="56" y="492.975">Each cell is the success rate over 100 rollouts; the rule marks the best method per task</tspan></text><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#8A9096" text-anchor="end"><tspan x="904" y="492.975">12</tspan></text></svg>