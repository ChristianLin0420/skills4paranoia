<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="01-problem"><rect width="960" height="540" fill="#F1F2F3"/><rect x="56" y="34" width="40.27" height="16" rx="2.5" fill="#DBE4EB"/><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#27435C" text-anchor="middle"><tspan x="76.135" y="45.5625">1 / 3</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#5F656B" text-anchor="start" letter-spacing="0.5"><tspan x="105.27" y="45.5625">Problem · what we are solving</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#8A9096" text-anchor="end"><tspan x="904" y="45.5625">Meridian-1 · Q3</tspan></text><rect x="56" y="62" width="848" height="0.75" rx="0" fill="#DCE0E3"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="23" fill="#14171A" text-anchor="start" letter-spacing="-0.2"><tspan x="56" y="111">A manipulation policy has to work on tasks it has never seen, yet the</tspan><tspan x="56" y="140.9">demonstration cost of every new task grows linearly</tspan></text><rect x="56" y="162.8" width="848" height="0.75" rx="0" fill="#DCE0E3"/><rect x="56" y="179.8" width="269.333" height="2" rx="0" fill="#3A6183"/><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#27435C" text-anchor="start" letter-spacing="0.6"><tspan x="56" y="197.775">Q1</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14171A" text-anchor="start"><tspan x="56" y="216.55">Sample efficiency: every new task needs</tspan><tspan x="56" y="234.05">thousands of fresh demonstrations</tspan></text><rect x="56" y="244.8" width="269.333" height="0.75" rx="0" fill="#E8EBED"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8A9096" text-anchor="start"><tspan x="56" y="262.35">·</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#5F656B" text-anchor="start"><tspan x="67" y="263.45">Real demos cost about $40 each — 20 tasks is</tspan><tspan x="67" y="279.4">$1.7M</tspan></text><rect x="56" y="289.7" width="269.333" height="0.75" rx="0" fill="#E8EBED"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8A9096" text-anchor="start"><tspan x="56" y="307.25">·</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#5F656B" text-anchor="start"><tspan x="67" y="308.35">Simulated data is cheap but carries a sim2real gap</tspan></text><rect x="56" y="318.65" width="269.333" height="0.75" rx="0" fill="#E8EBED"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8A9096" text-anchor="start"><tspan x="56" y="336.2">·</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#5F656B" text-anchor="start"><tspan x="67" y="337.3">Data demand scales with task count and never</tspan><tspan x="67" y="353.25">amortises</tspan></text><rect x="345.333" y="179.8" width="269.333" height="2" rx="0" fill="#787E85"/><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#27435C" text-anchor="start" letter-spacing="0.6"><tspan x="345.333" y="197.775">Q2</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14171A" text-anchor="start"><tspan x="345.333" y="216.55">Generalisation: success collapses outside the</tspan><tspan x="345.333" y="234.05">training distribution</tspan></text><rect x="345.333" y="244.8" width="269.333" height="0.75" rx="0" fill="#E8EBED"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8A9096" text-anchor="start"><tspan x="345.333" y="262.35">·</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#5F656B" text-anchor="start"><tspan x="356.333" y="263.45">Changing material or lighting breaks it</tspan></text><rect x="345.333" y="273.75" width="269.333" height="0.75" rx="0" fill="#E8EBED"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8A9096" text-anchor="start"><tspan x="345.333" y="291.3">·</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#5F656B" text-anchor="start"><tspan x="356.333" y="292.4">Long-horizon tasks lose context after the second</tspan><tspan x="356.333" y="308.35">subgoal</tspan></text><rect x="345.333" y="318.65" width="269.333" height="0.75" rx="0" fill="#E8EBED"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8A9096" text-anchor="start"><tspan x="345.333" y="336.2">·</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#5F656B" text-anchor="start"><tspan x="356.333" y="337.3">Contact-rich tasks have almost no force signal in</tspan><tspan x="356.333" y="353.25">the demos</tspan></text><rect x="634.667" y="179.8" width="269.333" height="2" rx="0" fill="#787E85"/><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#27435C" text-anchor="start" letter-spacing="0.6"><tspan x="634.667" y="197.775">Q3</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#14171A" text-anchor="start"><tspan x="634.667" y="216.55">Deployability: inference latency does not fit</tspan><tspan x="634.667" y="234.05">closed-loop control</tspan></text><rect x="634.667" y="244.8" width="269.333" height="0.75" rx="0" fill="#E8EBED"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8A9096" text-anchor="start"><tspan x="634.667" y="262.35">·</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#5F656B" text-anchor="start"><tspan x="645.667" y="263.45">Vision encoding eats more than half the budget</tspan></text><rect x="634.667" y="273.75" width="269.333" height="0.75" rx="0" fill="#E8EBED"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8A9096" text-anchor="start"><tspan x="634.667" y="291.3">·</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#5F656B" text-anchor="start"><tspan x="645.667" y="292.4">p99 jitter is unmeasured, so no safety margin</tspan><tspan x="645.667" y="308.35">can be derived</tspan></text><rect x="634.667" y="318.65" width="269.333" height="0.75" rx="0" fill="#E8EBED"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8A9096" text-anchor="start"><tspan x="634.667" y="336.2">·</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#5F656B" text-anchor="start"><tspan x="645.667" y="337.3">Diffusion methods run 23ms/step and cannot hold</tspan><tspan x="645.667" y="353.25">30Hz</tspan></text><rect x="56" y="434" width="16" height="2" rx="0" fill="#3A6183"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#5F656B" text-anchor="start"><tspan x="80" y="438.55">Left unsolved, every new task is a data-engineering project started from zero.</tspan></text><rect x="56" y="476" width="848" height="0.75" rx="0" fill="#DCE0E3"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#8A9096" text-anchor="start"><tspan x="56" y="492.975">Example deck · all figures are fictional</tspan></text><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#8A9096" text-anchor="end"><tspan x="904" y="492.975">01</tspan></text></svg>