"310.152">100k</tspan></text><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#8A9096" text-anchor="middle"><tspan x="632.755" y="310.152">150k</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#8A9096" text-anchor="end"><tspan x="812.34" y="310.152">env steps</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#8A9096" text-anchor="start"><tspan x="56" y="328.152">success rate on 20 held-in tasks · rollouts=100/task</tspan></text><rect x="56" y="339.177" width="848" height="0.75" rx="0" fill="#DCE0E3"/><rect x="56" y="349.177" width="14" height="2" rx="0" fill="#3A6183"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#14171A" text-anchor="start"><tspan x="56" y="370.277">The split happens at 50k steps</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#5F656B" text-anchor="start"><tspan x="56" y="388.977">Before that the three curves overlap, so the gap is not</tspan><tspan x="56" y="403.227">from initialisation</tspan></text><rect x="345.333" y="349.177" width="14" height="2" rx="0" fill="#20242A"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#14171A" text-anchor="start"><tspan x="345.333" y="370.277">The diffusion baseline flattens after 125k</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#5F656B" text-anchor="start"><tspan x="345.333" y="388.977">Meridian-1 is still climbing, so more data still buys progress</tspan></text><rect x="634.667" y="349.177" width="14" height="2" rx="0" fill="#6E8FA8"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#14171A" text-anchor="start"><tspan x="634.667" y="370.277">The ±1σ band narrows after 100k</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#5F656B" text-anchor="start"><tspan x="634.667" y="388.977">All three seeds agree; this is not one lucky run</tspan></text><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#8A9096" text-anchor="start"><tspan x="56" y="462.45">TaskSuite-20 · 3 seeds · ±1σ · A100×8 · each point is the success rate over 100 rollouts.</tspan></text><rect x="56" y="476" width="848" height="0.75" rx="0" fill="#DCE0E3"/><text font-family="'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#8A9096" text-anchor="start"><tspan x="56" y="492.975">runs/2026-08/curves.csv</tspan></text><text font-family="'IBM Plex Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#8A9096" text-anchor="end"><tspan x="904" y="492.975">06</tspan></text></svg>