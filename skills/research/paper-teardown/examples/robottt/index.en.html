<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboTTT: Context Scaling for Robot Policies — a teardown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* palette: ours, unchanged. layout and type: editorial long-read. */
  --paper:#FAFBFB; --sunk:#F1F2F3; --frame:#FFFFFF;
  --ink:#14171A; --body:#3B4147; --muted:#6E747A; --faint:#8A9096;
  --rule:#DCE0E3; --rule-soft:#E8EBED;
  --accent:#3A6183; --accent-deep:#27435C; --accent-soft:#DBE4EB; --wash:#EAF0F4;
  --warn:#8C4A3C; --warn-soft:#EFE3E0;
  --name:#54547A; --name-soft:#E6E6EE;
  --sans:"Barlow","Noto Sans TC",-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--body);font-family:var(--sans);
     font-size:17px;line-height:1.75;font-weight:400;letter-spacing:.005em;
     -webkit-font-smoothing:antialiased}
img{max-width:100%;display:block;height:auto}
a{color:var(--accent-deep);text-decoration:none;border-bottom:1px solid rgba(58,97,131,.42)}
a:hover{border-bottom-color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3,h4,h5{margin:0;color:var(--ink)}
p{margin:0 0 16px;max-width:68ch}
ul,ol{margin:0 0 18px;padding-left:1.15em;max-width:68ch}
li{margin-bottom:9px}
li::marker{color:var(--accent-deep)}
strong,b{font-weight:600;color:var(--ink)}
em{font-style:italic}
code{font-family:var(--mono);font-size:.86em;background:var(--wash);padding:1px 6px;color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}

/* ---------- masthead ---------- */
.masthead{border-bottom:1px solid var(--rule);padding:22px 0}
.masthead .wrap{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.mark{width:26px;height:12px;background:var(--accent);flex:none;transform:skewX(-20deg)}
.masthead b{font-weight:600;font-size:.95rem;letter-spacing:.01em}
.masthead span{color:var(--muted);font-size:.85rem}

/* ---------- hero ---------- */
.hero{padding:72px 0 8px}
.hero h1{font-weight:600;margin:0 0 22px;font-size:clamp(2.1rem,5.4vw,3.7rem);
         line-height:1.06;letter-spacing:-.022em;max-width:22ch}
.byline{font-size:.92rem;color:var(--body);max-width:64ch;margin:0 0 4px}
.affil{font-family:var(--mono);font-size:.78rem;color:var(--faint);margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}
.chip{font-family:var(--mono);font-size:.76rem;padding:6px 10px;border:1px solid var(--rule);
      background:var(--frame);color:var(--muted);border-bottom-width:1px}
a.chip:hover{border-color:var(--accent);color:var(--accent-deep)}
.chip.lic{background:var(--wash);border-color:var(--accent-soft);color:var(--accent-deep)}
.hero .lede{font-size:clamp(1.05rem,1.9vw,1.3rem);line-height:1.6;max-width:60ch;
            color:var(--body);margin:0 0 10px}

/* ---------- tier legend + filter ---------- */
.legend{display:flex;flex-wrap:wrap;gap:9px;margin:26px 0 0;padding-top:20px;border-top:1px solid var(--rule-soft)}
.tierkey{font-family:var(--mono);font-size:.74rem;padding:7px 11px;cursor:pointer;user-select:none;
         background:var(--frame);color:var(--muted);line-height:1.3}
.tierkey[data-t=verified]{border:1.5px solid var(--accent)}
.tierkey[data-t=stated]{border:1px solid var(--rule)}
.tierkey[data-t=inferred]{border:1px dashed var(--faint)}
.tierkey.off{opacity:.34;text-decoration:line-through}
.dim{opacity:.2;filter:grayscale(.75)}
.tag{display:inline-block;font-family:var(--mono);font-size:.68rem;padding:3px 7px;
     border:1px solid var(--rule);color:var(--faint);background:var(--frame);
     vertical-align:.18em;font-weight:400;letter-spacing:0}
.tag.verified{border-color:var(--accent);color:var(--accent-deep);background:var(--wash)}
.tag.inferred{border-style:dashed}
.tag.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}

/* ---------- hero diagram ---------- */
.diagram{margin:52px 0 8px;border-top:1px solid var(--rule);padding-top:30px}
.diagram h2{font-size:1.05rem;font-weight:600;margin:0 0 4px}
.diagram p.note{font-size:.85rem;color:var(--muted);margin:0 0 22px;max-width:64ch}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:206px minmax(0,1fr);gap:56px;padding:64px 0 0}
nav.rail{position:sticky;top:28px;align-self:start;font-size:.88rem;line-height:1.5;
         max-height:calc(100vh - 56px);overflow:auto}
nav.rail p{margin:0 0 14px;color:var(--muted);font-size:.78rem}
nav.rail a{display:block;padding:7px 0 7px 13px;border:0;border-left:2px solid var(--rule-soft);color:var(--body)}
nav.rail a:hover{border-left-color:var(--accent);color:var(--ink)}
nav.rail a.on{border-left-color:var(--accent);background:var(--wash)}
nav.rail a b{display:block;font-weight:600;color:var(--ink)}
nav.rail a i{font-style:normal;color:var(--muted);font-size:.78rem;display:block;line-height:1.35}
nav.rail a.sub{padding-left:26px}
nav.rail a.sub b{font-weight:500;font-size:.85rem}
main{min-width:0}
section{padding-bottom:76px}
section + section{border-top:1px solid var(--rule);padding-top:56px}
h2.sec{font-size:clamp(1.55rem,3vw,2.15rem);font-weight:600;letter-spacing:-.015em;
       line-height:1.15;margin:0 0 6px}
h2.sec .en{display:block;font-size:.6em;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.keyline{width:74px;height:4px;background:var(--accent);margin:20px 0 24px}
h3{font-size:1.12rem;font-weight:600;margin:38px 0 10px;line-height:1.4}
h3:first-of-type{margin-top:0}
h4{font-size:1rem;font-weight:600;margin:26px 0 8px}
.lab{font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}

/* ---------- editorial primitives ---------- */
.term{font-weight:600;color:var(--ink);box-shadow:inset 0 -.42em 0 rgba(58,97,131,.22)}
/* one highlighter only. proper nouns get colour, not a second stripe. */
.mn{font-weight:600;color:var(--name)}
.oneline{border-left:4px solid var(--accent);background:var(--wash);padding:18px 22px;
         margin:0 0 30px;max-width:68ch;font-size:1.06rem;line-height:1.62;
         color:var(--ink);font-weight:500}
.oneline b{font-weight:700}
dl.meta{display:grid;grid-template-columns:auto 1fr;gap:5px 18px;font-size:.87rem;
        margin:0 0 30px;max-width:66ch}
dl.meta dt{color:var(--muted)}
dl.meta dd{margin:0;color:var(--body)}
.stats{display:flex;flex-wrap:wrap;gap:0;margin:26px 0 8px;border-top:1px solid var(--rule)}
.stats>div{flex:1 1 190px;padding:18px 24px 18px 0;border-bottom:1px solid var(--rule)}
.stats .v{font-size:1.65rem;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:-.02em}
.stats .v em{font-style:normal;color:var(--accent-deep)}
.stats .k{font-size:.82rem;color:var(--body);margin-top:5px;line-height:1.45}
.stats .vs{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin-top:4px;line-height:1.4}
ol.contrib{list-style:none;padding:0;margin:0 0 8px;max-width:68ch}
ol.contrib li{display:grid;grid-template-columns:34px 1fr;gap:16px;padding:18px 0;
              border-top:1px solid var(--rule-soft);margin:0}
ol.contrib li:last-child{border-bottom:1px solid var(--rule-soft)}
ol.contrib .n{font-weight:600;color:var(--accent-deep);font-size:1.05rem;line-height:1.6}
ol.contrib b{display:block;margin-bottom:3px}
.caveat{background:var(--wash);padding:20px 24px;margin:26px 0 0;max-width:70ch}
.caveat h4{margin:0 0 10px}
.caveat ul{margin:0}
.caveat li{font-size:.94rem}
.caveat.warnbox{background:var(--warn-soft);border-left:4px solid var(--warn)}
.caveat.warnbox h4{color:var(--warn)}

/* ---------- maths ---------- */
.eq{margin:22px 0 6px;padding:20px 12px;background:var(--sunk);overflow-x:auto;text-align:center}
.eq math{font-size:1.16em}
.eqno{font-family:var(--mono);font-size:.74rem;color:var(--muted);text-align:right;margin:-2px 2px 0 0}
.sym{cursor:pointer;padding:0 1px}
.sym:hover{background:var(--accent-soft)}
.sym.lit{background:var(--accent-soft);outline:1.5px solid var(--accent)}
table.syms{border-collapse:collapse;width:100%;margin:20px 0 8px;font-size:.9rem}
table.syms th{text-align:left;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;
              color:var(--muted);font-weight:600;padding:0 14px 9px 0;border-bottom:2px solid var(--accent)}
table.syms td{padding:11px 14px 11px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top}
table.syms tr{cursor:pointer}
table.syms tr.lit td{background:var(--wash)}
table.syms td.s{font-family:var(--mono);white-space:nowrap;width:1%}
td.sh{font-family:var(--mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
td.nt{font-size:.86rem;color:var(--body)}
.prov{font-family:var(--mono);font-size:.68rem;padding:3px 7px;border:1px solid var(--rule);
      color:var(--muted);background:var(--frame);white-space:nowrap}
.prov.fast{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep);font-weight:500}
.prov.learned{border-color:var(--name-soft);background:var(--name-soft);color:var(--name)}
.codeline{display:inline-block;font-family:var(--mono);font-size:.74rem;color:var(--accent-deep);
          background:var(--wash);border:1px solid var(--accent-soft);padding:4px 8px;
          margin:4px 6px 0 0;border-bottom-width:1px}
a.codeline:hover{background:var(--accent-soft)}

/* ---------- figures ---------- */
figure{margin:30px 0 8px}
figure .frame{border:1px solid var(--rule);padding:14px;background:var(--frame)}
figure img{cursor:zoom-in}
figcaption{font-size:.83rem;color:var(--muted);line-height:1.6;margin-top:11px;max-width:78ch}
figcaption b{color:var(--ink);font-weight:600}
figcaption .fnum{font-family:var(--mono);color:var(--faint);margin-right:7px}
.read{border-left:2px solid var(--accent);padding:2px 0 2px 20px;margin:22px 0 34px;max-width:68ch}
.read h5{margin:0 0 10px;font-size:.93rem;font-weight:600}
.read ul{margin:0;padding-left:1.05em}
.read li{font-size:.95rem;margin-bottom:8px}
.read li b{font-weight:600}
.lb{position:fixed;inset:0;background:rgba(20,23,26,.92);display:none;place-items:center;
    z-index:50;padding:24px;cursor:zoom-out}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:92vh;background:#fff}

/* ---------- tables ---------- */
.tbl{width:100%;overflow-x:auto;margin:26px 0 10px}
table.data{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
table.data th,table.data td{text-align:left;vertical-align:top;padding:14px 16px 14px 0;
                            border-bottom:1px solid var(--rule-soft)}
table.data thead th{font-weight:600;color:var(--ink);border-bottom:3px solid var(--accent);padding-bottom:10px}
table.data td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.data tr.best td{background:var(--wash)}
table.data tr.best td.n,table.data tr.best td:first-child{font-weight:600;color:var(--accent-deep)}
table.data tr[data-jump]{cursor:pointer}
table.data tr[data-jump]:hover td{background:var(--wash)}

/* ---------- diagrams ---------- */
.dia{margin:0 0 44px}
.dia svg{display:block;width:100%;height:auto;margin:14px 0 4px;overflow:visible}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;
      padding-top:14px;border-top:1px solid var(--rule-soft)}
.ctrl button{font-family:var(--mono);font-size:.76rem;padding:7px 12px;border:1px solid var(--rule);
             background:var(--frame);color:var(--muted);cursor:pointer}
.ctrl button:hover{border-color:var(--accent);color:var(--accent-deep)}
.ctrl button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ctrl .cl{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.dia .say{margin-top:14px;font-size:.95rem;line-height:1.62;color:var(--body);
          max-width:70ch;min-height:3.2em}
.dia .say b{color:var(--ink);font-weight:600}

/* ---------- code section ---------- */
.pre{background:#14171A;color:#D6DBDF;padding:16px 18px;overflow-x:auto;
     font-family:var(--mono);font-size:.76rem;line-height:1.65;white-space:pre;margin:16px 0 0}
details{border-top:1px solid var(--rule);margin:26px 0 0}
summary{cursor:pointer;padding:14px 0;font-size:.95rem;color:var(--accent-deep);list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";color:var(--faint)}
details[open] summary:before{content:"▾ "}
.vd{margin:0 0 6px;padding:26px 0;border-top:1px solid var(--rule-soft)}
.vd:last-of-type{border-bottom:1px solid var(--rule-soft)}
.vd h3{margin:0 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.vd dl.pair{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:14px 0 0;
            font-size:.94rem;max-width:70ch}
.vd dl.pair dt{color:var(--muted);font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;
               white-space:nowrap;line-height:1.9}
.vd dl.pair dd{margin:0;line-height:1.62}

/* ---------- sources + footer ---------- */
table.src{border-collapse:collapse;width:100%;font-size:.87rem}
table.src td{padding:13px 16px 13px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top}
table.src td .note{color:var(--muted);font-size:.83rem;line-height:1.55;margin-top:3px;max-width:70ch}
table.src td.d{font-family:var(--mono);font-size:.76rem;color:var(--faint);white-space:nowrap;text-align:right}
footer{border-top:1px solid var(--rule);padding:34px 0 60px;font-size:.85rem;color:var(--muted)}
footer p{max-width:74ch;margin:0 0 10px}

@media (max-width:900px){
  body{font-size:16px}
  .shell{grid-template-columns:1fr;gap:0;padding-top:40px}
  nav.rail{display:none}
  .hero{padding-top:44px}
  ol.contrib li{grid-template-columns:26px 1fr;gap:12px}
  .stats>div{padding-right:16px}
}
@media (prefers-reduced-motion:no-preference){
  .grow{transform-box:fill-box;transform-origin:left center;
        animation:grow .75s cubic-bezier(.2,.7,.3,1) both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}
</style>
</head>
<body>

<header class="masthead"><div class="wrap">
  <span class="mark" aria-hidden="true"></span>
  <b id="mh1"></b><span id="mh2"></span>
</div></header>

<div class="wrap">
  <div class="hero" id="hero"></div>
  <div class="diagram" id="herodia" hidden></div>
  <div class="shell">
    <nav class="rail" aria-label="contents"><p id="navlab"></p><div id="nav"></div></nav>
    <main id="body"></main>
  </div>
  <footer><p id="foot"></p></footer>
</div>
<div class="lb" id="lb"></div>

<script>
const TEARDOWN = {
 "macros": {
  "\\acronym": "\\textsc{RoboTTT}",
  "\\FW": "\\mathrm{FW}"
 },
 "mechanisms": [
  {
   "id": "m-ttt",
   "num": "Eq. 1–2",
   "tier": "stated",
   "short": "The TTT update",
   "title": "The recurrent state is a small network's weights",
   "lede": "Two equations, one idea: <b><span class=\"term\">update, then apply</span></b>. Everything else in the paper is scaffolding around this.",
   "eqs": [
    {
     "num": "(1)",
     "mathml": "<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>W</mi><mi>t</mi></msub><mo stretchy=\"false\">←</mo><msub><mi>W</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msub><mo>−</mo><mi>η</mi><msub><mo form=\"prefix\" stretchy=\"false\">∇</mo><mi>W</mi></msub><msub><mi class=\"mathcal\">ℒ</mi><mpadded lspace=\"0\"><mi>FW</mi></mpadded></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>f</mi><msub><mi>W</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msub></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>K</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo separator=\"true\">,</mo><msub><mi>V</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow></math>"
    },
    {
     "num": "(2)",
     "mathml": "<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>O</mi><mi>t</mi></msub><mo>=</mo><msub><mi>f</mi><msub><mi>W</mi><mi>t</mi></msub></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>Q</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>"
    }
   ],
   "symbols": [
    {
     "key": "W",
     "name": "<b>fast weights</b> — the recurrent state",
     "shape": "params of a 2-layer MLP",
     "prov": "fast",
     "note": "Not a vector. This is the whole point: an MLP's parameter set holds more than an RNN's hidden vector.",
     "sym": "<math><msub><mi>W</mi><mi>t</mi></msub></math>"
    },
    {
     "key": "f",
     "name": "the <b><span class=\"term\">fast model</span></b>",
     "shape": "ℝ^d → ℝ^d",
     "prov": "derived",
     "note": "Two-layer MLP with GeLU (App. A). Its architecture is fixed; its parameters are <math><mi>W</mi></math>.",
     "sym": "<math><msub><mi>f</mi><mi>W</mi></msub></math>"
    },
    {
     "key": "η",
     "name": "inner learning rate",
     "shape": "scalar",
     "prov": "learned",
     "note": "Learned, on a constant base of 0.1 (App. A). The one number that decides how hard a single timestep overwrites the state.",
     "sym": "<math><mi>η</mi></math>"
    },
    {
     "key": "ℒ",
     "name": "fast-weight loss",
     "shape": "scalar",
     "prov": "derived",
     "note": "<math><mrow><mi>‖</mi><mover><mi>v</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>−</mo><mi>v</mi><msup><mi>‖</mi><mn>2</mn></msup></mrow></math> — plain MSE. The <i>inner</i> loss; not the task loss.",
     "sym": "<math><msub><mi class=\"mathcal\">ℒ</mi><mpadded lspace=\"0\"><mi>FW</mi></mpadded></msub></math>"
    },
    {
     "key": "K",
     "name": "key at this timestep",
     "shape": "(d,)",
     "prov": "derived",
     "note": "<math><mrow><msub><mi>K</mi><mi>t</mi></msub><mo>=</mo><msub><mi>θ</mi><mi>K</mi></msub><msub><mi>X</mi><mi>t</mi></msub></mrow></math>. Together with <math><msub><mi>V</mi><mi>t</mi></msub></math> it is the (question, answer) pair written into the state.",
     "sym": "<math><msub><mi>K</mi><mi>t</mi></msub></math>"
    },
    {
     "key": "V",
     "name": "value at this timestep",
     "shape": "(d,)",
     "prov": "derived",
     "note": "The regression target the fast model is pushed toward.",
     "sym": "<math><msub><mi>V</mi><mi>t</mi></msub></math>"
    },
    {
     "key": "Q",
     "name": "query at this timestep",
     "shape": "(d,)",
     "prov": "derived",
     "note": "<math><mrow><msub><mi>Q</mi><mi>t</mi></msub><mo>=</mo><msub><mi>θ</mi><mi>Q</mi></msub><msub><mi>X</mi><mi>t</mi></msub></mrow></math>. What gets asked of the state after it has been updated.",
     "sym": "<math><msub><mi>Q</mi><mi>t</mi></msub></math>"
    },
    {
     "key": "O",
     "name": "TTT layer output",
     "shape": "(d,)",
     "prov": "derived",
     "note": "Goes on to be gated against the attention output — see Eq. 3.",
     "sym": "<math><msub><mi>O</mi><mi>t</mi></msub></math>"
    },
    {
     "key": "t",
     "name": "timestep in the rollout",
     "shape": "1…T",
     "prov": "index",
     "note": "Ranges over the trajectory, up to 8192. <b>Not</b> the flow-matching time — that is <math><mi>τ</mi></math>.",
     "sym": "<math><mi>t</mi></math>"
    }
   ],
   "gloss": [
    "<b>What it does.</b> At every timestep the layer takes one gradient step on a small MLP, using this step's key as input and its value as target, then asks that just-updated MLP the step's query. The history is not stored — it is <i>trained into</i> a network, and read back out by querying it.",
    "<b>Why not something simpler.</b> A transformer keeps every past key and value and attends over them, so decoding cost grows with history — unaffordable on a 30 Hz control loop over five minutes. An RNN keeps a fixed-size vector, which is cheap but small. Fast weights are the middle: fixed size, but the size of a network rather than a vector, and the write rule is gradient descent rather than a fixed linear update.",
    "<b>What one symbol changes.</b> Make <math><msub><mi>f</mi><mi>W</mi></msub></math> a linear layer instead of an MLP and the paper's own ablation loses 27% (Fig. 12). The capacity of the thing being written into is doing the work, not the fact that something is being written into."

  "sentence": "Make a robot policy's recurrent state be <b>the weights of a small MLP that keeps training during the rollout</b>, and the policy can condition on 8,000 timesteps — about five minutes of 30 Hz control — at inference cost that does not grow with history.",

 "problem": {
  "theirs": [
   "State-of-the-art robot foundation models see one frame, or a handful. Context length has become a scaling axis for language models and has not been one for policies. Long visuomotor context is what would buy one-shot imitation from a human video, improvement from the robot's own deployment history, and closed-loop performance on tasks with many stages.",
   "Three obstacles are named: a history needs enough capacity to encode, the conditioned context has to actually be exploited rather than merely stored, and inference cost must stay flat. A transformer's KV cache grows with history; an RNN's state vector is too small; <span class=\"term\">fast weights</span> are proposed as the point between them."
  ],
  "mine": [
   "The framing does two things at once and it is worth separating them. This is not the language-model sense of long context, where a long prompt is handed in from outside. It is a <b>closed loop</b> — the policy's own actions become the context it later conditions on. That is why causal confusion is the standing hazard here and why the related-work section spends a paragraph on it; it is a failure mode a long prompt does not have.",
   "And the real comparison is narrower than the title suggests. GDN — the paper's own strongest baseline — also carries a fixed-size state across the whole rollout. The paper says so outright: both maintain fixed-size states, and the difference is the update rule. So the finding is not <i>memory beats no memory</i>. It is that <b>a state written by gradient descent scales with context length and a state written by a linear associative rule does not</b> (Fig. 8). That is a sharper and more surprising claim, and it is the one the scaling curve actually supports."
  ]
 },

/* ===== shared blocks ===== */
function reading(r) {
  if (!r) return "";
  const li = (k, v) => v ? '<li><b>' + esc(k) + '.</b> ' + v + '</li>' : "";
  return '<div class="read"><h5>' + esc(U.readTitle) + '</h5><ul>' +
    li(U.look, r.look) + li(U.means, r.means) + li(U.change, r.change) + '</ul></div>';

function figure(f) {
  if (!f) return "";
  const body = f.link
    ? '<div class="frame" style="padding:26px 14px;text-align:center;color:var(--muted)">' +
      esc(f.link.note) + ' — <a href="' + f.link.url + '" target="_blank" rel="noopener">' +
      esc(f.link.label) + '</a></div>'
    : '<div class="frame">' + (f.files || [f.file]).map((fl, i) =>
        '<img src="' + ((f.dataUris && f.dataUris[i]) || ("assets/" + fl)) +
        '" alt="' + esc(f.caption || "") + '" loading="lazy"' +
        (i ? ' style="margin-top:8px"' : '') + '>').join("") + '</div>';
  return '<figure>' + body + '<figcaption><span class="fnum">' + esc(f.num || "") + '</span>' +
    (f.caption || "") + (f.credit ? ' <span style="color:var(--faint)">— ' + esc(f.credit) + '</span>' : "") +
    '</figcaption>' + reading(f.read) + '</figure>';
}
function dtable(t) {

    t.cols.map(c => '<th>' + esc(c) + '</th>').join("") + '</tr></thead><tbody>' +
    t.rows.map(r => '<tr' + (r.best ? ' class="best"' : '') + '>' +
      r.cells.map((c, i) => '<td' + (i ? ' class="n"' : '') + '>' + esc(c) + '</td>').join("") +
      '</tr>').join("") + '</tbody></table></div>' +
    (t.caption ? '<figcaption><span class="fnum">' + esc(t.num || "") + '</span>' + t.caption + '</figcaption>' : "");
}

      '<td class="sh">' + esc(s.shape || "") + '</td>' +
      '<td><span class="prov ' + esc(s.prov) + '">' + esc(s.prov) + '</span></td>' +
      '<td class="nt">' + (s.note || "") + '</td></tr>').join("") + '</tbody></table>' : "";
  const eqs = (m.eqs || []).map(e =>
    '<div class="eq" data-eq="' + m.id + '">' + e.mathml + '</div>' +
    (e.num ? '<div class="eqno">' + esc(e.num) + '</div>' : "")).join("");
  const code = (m.code || []).map(c =>
    '<a class="codeline" href="' + (c.url || "#code") + '"' +
    (c.url ? ' target="_blank" rel="noopener"' : "") + '>' + esc(c.path) + ':' + esc(c.line) +
    '  ' + esc(c.ident) + '</a>').join("");
  return '<div id="' + m.id + '" data-tier="' + (m.tier || "stated") + '" style="scroll-margin-top:20px">' +
    '<h3>' + m.title + ' <span class="eqno" style="display:inline;margin:0">' + esc(m.num || "") + '</span> ' +
      tierTag(m.tier) + '</h3>' +
    (m.lede ? '<p class="oneline">' + m.lede + '</p>' : "") +
    eqs + syms +
    (m.gloss || []).map(g => '<p>' + g + '</p>').join("") +
    (code ? '<div style="margin:14px 0 0">' + code + '</div>' : "") +
    figure(m.fig) + '</div>';
}

const links = [...document.querySelectorAll("#nav a")];
const spy = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return;
  links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }),
  {rootMargin:"-10% 0px -80% 0px"});
S.forEach(s => { const n = document.getElementById(s.id); if (n) spy.observe(n); });

/* ===== symbol <-> equation ===== */
const SYM = {};
TEARDOWN.mechanisms.forEach(m => { SYM[m.id] = new Set((m.symbols || []).map(s => s.key)); });
document.querySelectorAll(".eq").forEach(box => {
  const keys = SYM[box.dataset.eq] || new Set();
  box.querySelectorAll("mi,mo").forEach(mi => {
    const key = mi.textContent.trim();
    if (!keys.has(key)) return;
    const p = mi.parentElement;
    const t = (/^(msub|msup|msubsup)$/i.test(p.tagName) && p.firstElementChild === mi) ? p : mi;
    t.classList.add("sym"); t.dataset.sym = key;
  });
});
const lightSym = (k, on) => document.querySelectorAll('[data-sym="' + CSS.escape(k) + '"]')
  .forEach(n => n.classList.toggle("lit", on));
let held = null;
document.addEventListener("mouseover", e => { const n = e.target.closest("[data-sym]");
  if (n && !held) lightSym(n.dataset.sym, true); });
document.addEventListener("mouseout", e => { const n = e.target.closest("[data-sym]");
  if (n && !held) lightSym(n.dataset.sym, false); });
document.addEventListener("click", e => {
  const n = e.target.closest("[data-sym]");
  if (held) { lightSym(held, false); const prev = held; held = null;
              if (!n || n.dataset.sym === prev) return; }
  if (n) { held = n.dataset.sym; lightSym(held, true); }
});

/* ===== lightbox ===== */
const lb = $("#lb");
document.addEventListener("click", e => {

  lb.innerHTML = '<img src="' + img.getAttribute("src") + '">'; lb.classList.add("on");
});
lb.addEventListener("click", () => lb.classList.remove("on"));
addEventListener("keydown", e => { if (e.key === "Escape") lb.classList.remove("on"); });

/* ===== tier filter ===== */

document.querySelectorAll(".tierkey").forEach(k => k.addEventListener("click", () => {

}));

/* ===== diagrams ===== */
/* ============================================================================
   Four diagram kinds, reusable across sequence-model papers. Each reads its
   spec from TEARDOWN.diagrams[i], renders into .stage[data-dia], wires
   .ctrl[data-ctrl] and narrates into .say[data-say].
   All copy comes from the spec, so a translated report needs no code change.
   ========================================================================== */
const SVGNS = "http://www.w3.org/2000/svg";
const A = "var(--accent)", AD = "var(--accent-deep)", ASOFT = "var(--accent-soft)",
      AWASH = "var(--wash)", INK = "var(--ink)", INK2 = "var(--body)",
      INK3 = "var(--muted)", RULE = "var(--rule)", SURF = "var(--frame)",
      WARN = "var(--warn)", WSOFT = "var(--warn-soft)", NAME = "var(--name)";

const svg = (w, h) => { const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("viewBox", "0 0 " + w + " " + h); s.setAttribute("width", w);
  s.setAttribute("height", h); return s; };
function node(tag, attrs, txt) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (txt != null) n.textContent = txt;
  return n;
}
function box(g, x, y, w, h, label, o) {
  o = o || {};
  g.appendChild(node("rect", {x, y, width:w, height:h, rx:o.rx || 3,
    fill:o.fill || SURF, stroke:o.stroke || RULE, "stroke-width":o.sw || 1,
    "stroke-dasharray":o.dash || "none", opacity:o.op == null ? 1 : o.op}));
  if (label != null) g.appendChild(node("text", {x:x + w/2, y:y + h/2 + 4,
    "text-anchor":"middle", fill:o.ink || INK, "font-family":"var(--mono)",
    "font-size":o.fs || 12, "font-weight":o.fw || 400, opacity:o.op == null ? 1 : o.op}, label));
}
function arrow(g, x1, y1, x2, y2, o) {
  o = o || {};
  g.appendChild(node("path", {d:o.d || ("M" + x1 + " " + y1 + "L" + x2 + " " + y2),
    fill:"none", stroke:o.stroke || INK3, "stroke-width":o.sw || 1.3,
    "stroke-dasharray":o.dash || "none", opacity:o.op == null ? 1 : o.op,
    "marker-end":"url(#" + (o.head || "ah") + ")"}));
}
function label(g, x, y, t, o) {
  o = o || {};
  g.appendChild(node("text", {x, y, "text-anchor":o.anchor || "middle",
    fill:o.ink || INK3, "font-family":o.mono === false ? "var(--sans)" : "var(--mono)",
    "font-size":o.fs || 10.5, "font-weight":o.fw || 400,
    opacity:o.op == null ? 1 : o.op}, t));
}
function defs(s) {
  const d = node("defs");
  [["ah", INK3], ["ahA", A], ["ahW", WARN], ["ahL", "#C6CCD1"]].forEach(([id, col]) => {
    const m = node("marker", {id, viewBox:"0 0 8 8", refX:7, refY:4, markerWidth:5.5,
      markerHeight:5.5, orient:"auto-start-reverse"});
    m.appendChild(node("path", {d:"M0 0.6 L8 4 L0 7.4 Z", fill:col}));
    d.appendChild(m);
  });
  s.appendChild(d);
}
/* Measure the widest label so the left gutter fits it. A constant here clips the
   moment the report is translated -- CJK labels are wider than their English source. */
function gutter(s, texts, fs) {
  const probe = node("g", {opacity:0}); s.appendChild(probe);
  let w = 0;
  texts.filter(Boolean).forEach(t => {
    const n = node("text", {x:0, y:0, "font-family":"var(--mono)", "font-size":fs || 10.5}, t);
    probe.appendChild(n); w = Math.max(w, n.getBBox().width);
  });
  probe.remove();
  return Math.ceil(w);
}
const stage = id => document.querySelector('.stage[data-dia="' + id + '"]');
const ctrl  = id => document.querySelector('.ctrl[data-ctrl="' + id + '"]');
const say   = id => document.querySelector('.say[data-say="' + id + '"]');
function buttons(id, groupLabel, items, initial, onPick) {
  const c = ctrl(id);
  if (groupLabel) c.appendChild(el("span", "cl", esc(groupLabel)));
  const bs = items.map((it, i) => {
    const b = el("button", i === initial ? "on" : "", esc(it.label));
    b.addEventListener("click", () => {
      bs.forEach(x => x.classList.remove("on")); b.classList.add("on"); onPick(i, it);
    });
    c.appendChild(b); return b;
  });
  return bs;
}

const DIA = {};

/* ---------------------------------------------------------------- 1. recurrence
   A state carried along a timeline: update from (K,V), then apply to Q.
   spec: {steps, stepText:[per-step narration], labels:{k,v,q,o,state,init}}      */
DIA.recurrence = function (d) {
  const T = d.steps || 5, W = 840, H = 208;
  const s = svg(W, H); defs(s);
  stage(d.id).appendChild(s);
  const lw = gutter(s, [d.labels.kv, d.labels.state, d.labels.o]);
  const initW = Math.max(52, gutter(s, [d.labels.init], 12.5) + 16);
  const x0 = lw + 16 + initW + 14, colw = (W - x0 - 12) / T;
  const g = node("g"); s.appendChild(g);

  label(g, 8, 34, d.labels.kv, {anchor:"start", ink:INK2});
  label(g, 8, 116, d.labels.state, {anchor:"start", ink:AD, fw:500});
  label(g, 8, 190, d.labels.o, {anchor:"start", ink:INK2});

  box(g, lw + 16, 92, initW, 34, d.labels.init, {fill:AWASH, stroke:ASOFT, ink:AD, fs:12.5});

  const parts = [];
  const bw = Math.min(88, colw - 22);
  for (let i = 0; i < T; i++) {
    const x = x0 + i * colw, gi = node("g"); g.appendChild(gi);
    box(gi, x, 16, bw, 30, d.labels.k + (i + 1) + "  " + d.labels.v + (i + 1), {fs:11});
    arrow(gi, x + bw / 2, 48, x + bw / 2, 88);
    label(gi, x + bw / 2 + 8, 70, d.labels.update, {anchor:"start", fs:9.5});
    box(gi, x, 92, bw, 34, d.labels.w + (i + 1), {fs:12.5, fw:500});
    if (i < T - 1) arrow(gi, x + bw, 109, x + colw - 2, 109);
    box(gi, x, 140, 40, 26, d.labels.q + (i + 1), {fs:11});
    arrow(gi, x + 20, 138, x + 30, 128);
    arrow(gi, x + bw / 2 + 8, 128, x + bw - 22, 170, {stroke:A, head:"ahA"});
    box(gi, x + bw - 40, 172, 40, 26, d.labels.o + (i + 1), {fs:11, stroke:A, fill:AWASH, ink:AD});
    parts.push(gi);
  }
  arrow(g, lw + 16 + initW, 109, x0 - 2, 109);

  let at = -1, timer = null;
  const paint = () => {
    parts.forEach((p, i) => p.setAttribute("opacity", at < 0 || i <= at ? 1 : 0.16));
    say(d.id).innerHTML = at < 0 ? d.stepText[0] : d.stepText[Math.min(at + 1, d.stepText.length - 1)];
  };
  const c = ctrl(d.id);
  c.appendChild(el("span", "cl", esc(d.labels.ctrl)));
  const mk = (t, fn) => { const b = el("button", "", esc(t)); b.addEventListener("click", fn); c.appendChild(b); return b; };
  mk(d.labels.back, () => { clearInterval(timer); at = Math.max(-1, at - 1); paint(); });
  mk(d.labels.fwd,  () => { clearInterval(timer); at = Math.min(T - 1, at + 1); paint(); });
  const play = mk(d.labels.play, () => {
    clearInterval(timer); at = -1; paint(); play.classList.add("on");
    timer = setInterval(() => { at++; paint();
      if (at >= T - 1) { clearInterval(timer); play.classList.remove("on"); } }, 850);
  });
  mk(d.labels.all, () => { clearInterval(timer); play.classList.remove("on"); at = T - 1; paint(); });
  at = T - 1; paint();
};

/* ------------------------------------------------------------- 2. truncation
   Gradients stop at segment boundaries; the carried state does not.
   spec: {steps, options:[{label, seg}], text(seg, reach)}                        */
DIA.truncation = function (d) {
  const T = d.steps || 12, W = 840, H = 172;
  const s = svg(W, H); defs(s);
  stage(d.id).appendChild(s);
  const pad = gutter(s, [d.labels.state, d.labels.grad]) + 18;
  const cw = (W - pad - 20) / T;
  const g = node("g"); s.appendChild(g);
  const draw = seg => {
    g.innerHTML = "";
    const reach = seg ? Math.min(seg, T) : T;
    label(g, 6, 56, d.labels.state, {anchor:"start", ink:AD, fw:500});
    label(g, 6, 120, d.labels.grad, {anchor:"start", ink:INK2});
    for (let i = 0; i < T; i++) {
      const x = pad + i * cw;
      box(g, x + 2, 40, cw - 6, 26, String(i + 1),
          {fs:10.5, fill:AWASH, stroke:ASOFT, ink:AD});
      if (i < T - 1) arrow(g, x + cw - 4, 53, x + cw + 2, 53, {stroke:A, head:"ahA", sw:1.1});
      const live = i >= T - reach;
      box(g, x + 2, 104, cw - 6, 22, "",
          {fill:live ? WSOFT : "transparent", stroke:live ? WARN : RULE,
           dash:live ? "none" : "3 3", sw:live ? 1.2 : 1});
      if (live && i < T - 1)
        arrow(g, x + cw + 2, 115, x + cw - 4, 115, {stroke:WARN, head:"ahW", sw:1.1});
    }
    if (seg) for (let b = seg; b < T; b += seg) {
      const x = pad + b * cw;
      g.appendChild(node("line", {x1:x, y1:26, x2:x, y2:140, stroke:INK3,
        "stroke-width":1, "stroke-dasharray":"4 4"}));
      label(g, x, 20, d.labels.cut, {ink:INK3, fs:9.5});
    }
    label(g, pad, 152, d.labels.axis, {anchor:"start", ink:INK3, fs:10});
    say(d.id).innerHTML = d.text.replace("{seg}", seg || T).replace("{reach}", reach).replace("{T}", T);
  };
  buttons(d.id, d.labels.ctrl, d.options, d.initial || 0, (i, it) => draw(it.seg));
  draw(d.options[d.initial || 0].seg);
};

/* -------------------------------------------------------------- 3. maskstrip
   Which timesteps update the state, and which contribute to the loss.
   spec: {schemes:[{label, roles:[..], loss:[bool], say}], roleColors, labels}     */
DIA.maskstrip = function (d) {
  const W = 840, H = 152;
  const s = svg(W, H); defs(s);
  stage(d.id).appendChild(s);
  const pad = gutter(s, [d.labels.step, d.labels.updates, d.labels.loss]) + 18;
  const g = node("g"); s.appendChild(g);
  const draw = sc => {
    g.innerHTML = "";
    const T = sc.roles.length, cw = (W - pad - 20) / T;
    label(g, 6, 34, d.labels.step, {anchor:"start", ink:INK2});
    label(g, 6, 80, d.labels.updates, {anchor:"start", ink:AD, fw:500});
    label(g, 6, 124, d.labels.loss, {anchor:"start", ink:INK2});
    for (let i = 0; i < T; i++) {
      const x = pad + i * cw, r = sc.roles[i], col = d.roleColors[r];
      box(g, x + 1.5, 18, cw - 4, 24, d.roleShort[r],
          {fs:10, fill:col.fill, stroke:col.stroke, ink:col.ink});
      box(g, x + 1.5, 64, cw - 4, 22, "", {fill:ASOFT, stroke:A, sw:1.1});
      const on = sc.loss[i];
      box(g, x + 1.5, 108, cw - 4, 22, on ? "" : d.labels.skip,
          {fs:9, fill:on ? WSOFT : "transparent", stroke:on ? WARN : RULE,
           dash:on ? "none" : "3 3", ink:INK3});
    }
    for (let i = 0; i < T - 1; i++)
      arrow(g, pad + (i + 1) * cw - 2.5, 75, pad + (i + 1) * cw + 1.5, 75, {stroke:A, head:"ahA", sw:1.1});
    say(d.id).innerHTML = sc.say;
  };
  buttons(d.id, d.labels.ctrl, d.schemes, d.initial || 0, (i, sc) => draw(sc));
  draw(d.schemes[d.initial || 0]);
};

/* ------------------------------------------------------------------ 4. axes2
   Two operators on two axes of the same grid: one within a column, one along a row.
   spec: {steps, tokens:[{key,label,through}], modes:[{label,axis,say}]}           */
DIA.axes2 = function (d) {
  const T = d.steps || 6, W = 840, y0 = 34;
  const rows = d.tokens.length, rh = 34, H = y0 + rows * rh + 40;
  const s = svg(W, H); defs(s);
  stage(d.id).appendChild(s);
  const x0 = gutter(s, d.tokens.map(t => t.label), 11) + 20;
  const cw = (W - x0 - 26) / T;
  const back = node("g"), front = node("g"); s.appendChild(back); s.appendChild(front);

  d.tokens.forEach((t, r) => label(back, x0 - 12, y0 + r * rh + rh / 2 + 4, t.label,
    {anchor:"end", ink:t.through === false ? INK3 : INK2, fs:11}));
  for (let i = 0; i < T; i++) label(back, x0 + i * cw + cw / 2, y0 - 10, d.labels.t + (i + 1), {fs:10});
  const cells = [];
  for (let r = 0; r < rows; r++) for (let i = 0; i < T; i++) {
    const x = x0 + i * cw + 2, y = y0 + r * rh + 3;
    const rect = node("rect", {x, y, width:cw - 5, height:rh - 7, rx:3,
      fill:SURF, stroke:RULE, "stroke-width":1});
    back.appendChild(rect); cells.push({rect, r, i, t:d.tokens[r]});
  }
  const draw = mode => {
    front.innerHTML = "";
    cells.forEach(c => {
      const inCol = mode.axis === "col" && c.i === (mode.at == null ? 1 : mode.at);
      const inRow = mode.axis === "row" && c.t.through !== false;
      const on = inCol || inRow;
      c.rect.setAttribute("fill", on ? (mode.axis === "col" ? ASOFT : AWASH) : SURF);
      c.rect.setAttribute("stroke", on ? A : (c.t.through === false ? RULE : RULE));
      c.rect.setAttribute("stroke-width", on ? 1.5 : 1);
      c.rect.setAttribute("stroke-dasharray", c.t.through === false ? "3 3" : "none");
      c.rect.setAttribute("opacity", c.t.through === false && mode.axis === "row" ? 0.45 : 1);
    });
    if (mode.axis === "col") {
      const i = mode.at == null ? 1 : mode.at, x = x0 + i * cw + cw / 2;
      arrow(front, x, y0 + 2, x, y0 + rows * rh - 6, {stroke:A, head:"ahA", sw:1.6});
      label(front, x + 8, y0 + rows * rh + 16, mode.note, {anchor:"start", ink:AD, fs:10.5});
    } else {
      d.tokens.forEach((t, r) => { if (t.through === false) return;
        arrow(front, x0 + 4, y0 + r * rh + rh / 2 - 3, W - 22, y0 + r * rh + rh / 2 - 3,
              {stroke:A, head:"ahA", sw:1.6, op:.85}); });
      label(front, x0, y0 + rows * rh + 16, mode.note, {anchor:"start", ink:AD, fs:10.5});
    }
    say(d.id).innerHTML = mode.say;
  };
  buttons(d.id, d.labels.ctrl, d.modes, d.initial || 0, (i, m) => draw(m));
  draw(d.modes[d.initial || 0]);
};

/* ------------------------------------------------------------------ 5. routing
   Sparse mixture-of-experts: how few of the pool a single token actually wakes.
   spec: {experts, cols, topk, shared, tokens:[{label, pick:[i..]}], labels, text}  */
DIA.routing = function (d) {
  const N = d.experts, cols = d.cols || 16, rows = Math.ceil(N / cols);
  const W = 840, gapx = 3, gapy = 4, top = 46;
  const s = svg(W, top + rows * (14 + gapy) + 46); defs(s);
  stage(d.id).appendChild(s);
  const lw = gutter(s, [d.labels.shared, d.labels.pool]) + 14;
  const cw = (W - lw - 8) / cols;
  const g = node("g"); s.appendChild(g);

  // deterministic pseudo-random pick per token, so the picture is stable across renders
  const pick = (seed, k) => {
    const out = new Set(); let x = seed * 9301 + 49297;
    while (out.size < k) { x = (x * 9301 + 49297) % 233280; out.add(x % N); }
    return out;
  };
  const cells = [];
  const draw = (ti) => {
    g.innerHTML = ""; cells.length = 0;
    const chosen = d.tokens[ti].pick ? new Set(d.tokens[ti].pick) : pick(ti + 1, d.topk);
    label(g, 6, top - 22, d.labels.pool, {anchor:"start", ink:INK2});
    box(g, lw, 12, Math.max(96, cw * 2), 20, d.labels.shared,
        {fill:ASOFT, stroke:A, ink:AD, fs:10.5});
    label(g, lw + Math.max(96, cw * 2) + 10, 26, d.labels.sharedNote, {anchor:"start", fs:9.5});
    for (let i = 0; i < N; i++) {
      const r = Math.floor(i / cols), c = i % cols;
      const on = chosen.has(i);
      box(g, lw + c * cw, top + r * (14 + gapy), cw - gapx, 14, "",
          {rx:2, fill:on ? A : SURF, stroke:on ? A : RULE, sw:on ? 1.2 : 0.8});
    }
    label(g, lw, top + rows * (14 + gapy) + 16, d.labels.axis
      .replace("{k}", d.topk).replace("{N}", N)
      .replace("{pct}", (100 * d.topk / N).toFixed(1)), {anchor:"start", ink:AD, fs:10.5});
    say(d.id).innerHTML = d.tokens[ti].say || d.text;
  };
  buttons(d.id, d.labels.ctrl, d.tokens, 0, i => draw(i));
  draw(0);
};

/* ------------------------------------------------------------------- 6. streams
   Two pipelines advancing at different rates: predict while you act, and what it
   costs when the fast one is never corrected.
   spec: {chunks, modes:[{label, async, reground, say}], labels}                    */
DIA.streams = function (d) {
  const n = d.chunks || 4, W = 840, H = 190;
  const s = svg(W, H); defs(s);
  stage(d.id).appendChild(s);
  const lw = gutter(s, [d.labels.predict, d.labels.execute, d.labels.obs]) + 16;
  const g = node("g"); s.appendChild(g);

  const draw = m => {
    g.innerHTML = "";
    const span = W - lw - 14;
    // synchronous: predict and execute alternate. asynchronous: they overlap.
    const unit = m.async ? span / n : span / (2 * n);
    label(g, 6, 40, d.labels.predict, {anchor:"start", ink:AD, fw:500});
    label(g, 6, 96, d.labels.execute, {anchor:"start", ink:INK2});
    label(g, 6, 150, d.labels.obs, {anchor:"start", ink:INK2});
    let stall = 0;
    for (let i = 0; i < n; i++) {
      const px = m.async ? lw + i * unit : lw + (2 * i) * unit;
      const ex = m.async ? lw + (i + 1) * unit : lw + (2 * i + 1) * unit;
      if (!m.async && i) stall += unit;
      box(g, px, 24, unit - 6, 26, d.labels.pred + (i + 1),
          {fs:10.5, fill:AWASH, stroke:A, ink:AD});
      if (ex + unit - 6 <= W - 8)
        box(g, ex, 80, unit - 6, 26, d.labels.exec + (i + 1), {fs:10.5, fill:SURF, stroke:RULE});
      // the drafted latent handed from prediction to execution
      if (ex + unit - 6 <= W - 8) arrow(g, px + unit / 2, 52, ex + unit / 2 - 4, 78, {stroke:A, head:"ahA"});
      // the real observation coming back, and whether anything is done with it
      if (ex + unit - 6 <= W - 8) {
        const gx = ex + unit / 2;
        box(g, gx - 9, 132, 18, 18, "", {rx:9, fill:m.reground ? WSOFT : "transparent",
             stroke:m.reground ? WARN : RULE, dash:m.reground ? "none" : "3 3"});
        if (m.reground && i < n - 1)
          arrow(g, gx, 130, px + unit + unit / 2, 54, {stroke:WARN, head:"ahW", sw:1.2,
            d:`M${gx} 130 C ${gx} 96, ${px+unit+unit/2} 92, ${px+unit+unit/2} 54`});
      }
    }
    if (!m.async && stall > 0) {
      for (let i = 0; i < n - 1; i++) {
        const x = lw + (2 * i + 1) * unit;
        box(g, x, 24, unit - 6, 26, d.labels.idle, {fs:9.5, fill:"transparent",
            stroke:RULE, dash:"3 3", ink:INK3});
      }
    }
    say(d.id).innerHTML = m.say;
  };
  buttons(d.id, d.labels.ctrl, d.modes, d.initial || 0, (i, m) => draw(m));
  draw(d.modes[d.initial || 0]);
};

(TEARDOWN.diagrams || []).forEach(d => { if (DIA[d.kind]) DIA[d.kind](d); });
</script>
